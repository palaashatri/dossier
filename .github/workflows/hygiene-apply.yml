name: One-time repository hygiene migration

on:
  push:
    branches:
      - feat/product-contract-discovery-v2
    paths:
      - ".github/workflows/hygiene-apply.yml"

permissions:
  contents: write

jobs:
  apply-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/product-contract-discovery-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply deterministic cleanup
        run: python tools/apply_repository_hygiene.py
      - name: Verify repository hygiene
        run: python -m unittest tools.test_repository_hygiene_audit
      - name: Verify provider registry and pinned assets
        run: python tools/provider_registry_audit.py --json
      - name: Check patch integrity
        run: git diff --check
      - name: Commit verified migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java TRUTH.md
          git commit -m "chore: remove production source fingerprints"
          git push origin HEAD:feat/product-contract-discovery-v2
